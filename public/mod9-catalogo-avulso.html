<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom Leon Assinatura — Escolha seus produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tabler-icons.min.css">
<style>
  :root{
    --bg:#F5F0E8;--card:#FFFFFF;--border:#E3D8C4;--border-strong:#C7B79A;
    --text-primary:#3B2314;--text-secondary:#6B5B47;--text-muted:#8A7860;
    --accent:#B8873B;--accent-bg:#FBF3E2;--accent-text:#6B4E1E;
    --radius:10px;--radius-lg:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;
  }
  .phone{
    width:100%;max-width:380px;background:var(--card);border:0.5px solid var(--border);
    border-radius:var(--radius-lg);padding:20px;min-height:640px;display:flex;flex-direction:column;
  }
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .topbar i{font-size:18px;cursor:pointer;}
  .topbar h2{font-size:16px;font-weight:600;font-family:'Fraunces',serif;}
  .subtotal-label{font-size:12px;color:var(--text-secondary);margin-bottom:10px;}
  .subtotal-label b{color:var(--text-primary);}

  .busca-box{
    display:flex;align-items:center;gap:8px;border:0.5px solid var(--border-strong);border-radius:10px;
    padding:9px 12px;margin-bottom:14px;
  }
  .busca-box input{
    border:none;outline:none;background:transparent;font-size:13px;font-family:inherit;
    color:var(--text-primary);flex:1;
  }
  .busca-box i{font-size:15px;color:var(--text-muted);}
  .busca-box .limpar{cursor:pointer;display:none;}

  .categoria{margin-bottom:10px;border:0.5px solid var(--border);border-radius:12px;overflow:hidden;}
  .categoria-titulo{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;font-weight:500;color:var(--text-primary);padding:12px 14px;cursor:pointer;
    font-family:'Fraunces',serif;
  }
  .categoria-titulo svg{width:16px;height:16px;color:var(--text-muted);transition:transform .15s;flex-shrink:0;}
  .categoria.aberta .categoria-titulo svg{transform:rotate(180deg);}
  .categoria-itens{display:none;padding:0 10px 10px;}
  .categoria.aberta .categoria-itens{display:block;}
  .categoria.oculta{display:none;}

  .item-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:0.5px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .item-thumb{
    width:40px;height:40px;border-radius:8px;background:var(--bg);flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);
  }
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-info{flex:1;min-width:0;}
  .item-info .nome{font-size:12.5px;}
  .item-info .preco-un{font-size:10.5px;color:var(--text-muted);margin-top:1px;}
  .item-info mark{background:var(--accent-bg);color:var(--accent-text);}
  .stepper{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .stepper button{
    width:24px;height:24px;border-radius:50%;border:0.5px solid var(--border-strong);
    background:var(--bg);font-size:13px;cursor:pointer;color:var(--text-primary);
  }
  .stepper .qtd{font-size:12.5px;font-weight:500;min-width:14px;text-align:center;}

  .sem-resultado{text-align:center;padding:30px 0;color:var(--text-muted);font-size:12.5px;}

  .carrinho-bar{
    margin-top:auto;padding-top:14px;background:var(--accent-bg);border-radius:10px;
    padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
  }
  .carrinho-bar .qtd-total{font-size:11px;color:var(--accent-text);}
  .carrinho-bar .valor-total{font-size:15px;font-weight:600;color:var(--text-primary);}
  .btn-primary{
    background:var(--text-primary);color:#fff;border:none;padding:0 18px;height:40px;
    border-radius:var(--radius);font-size:12.5px;font-family:inherit;cursor:pointer;
  }
  .btn-primary:disabled{background:var(--border-strong);cursor:not-allowed;}

  /* Lightbox (clique na imagem) */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px;}
  .lightbox.open{display:flex;}
  .lightbox-close-btn{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lb-car-wrap{position:relative;width:90vw;max-width:420px;aspect-ratio:1;}
  .lb-car-imgs{display:flex;height:100%;transition:transform .25s ease;}
  .lb-car-imgs img{width:100%;height:100%;object-fit:contain;flex-shrink:0;border-radius:10px;}
  .lb-sem-img{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.6);font-size:13px;width:90vw;max-width:420px;aspect-ratio:1;}
  .lb-sem-img i{font-size:36px;}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
  .lb-btn.prev{left:-44px;}
  .lb-btn.next{right:-44px;}
  .lb-dots{display:flex;gap:6px;}
  .lb-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;}
  .lb-dots span.on{background:#fff;}
  .lb-thumbs{display:flex;gap:6px;max-width:90vw;overflow-x:auto;}
  .lb-thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1.5px solid transparent;cursor:pointer;flex-shrink:0;opacity:.6;}
  .lb-thumbs img.on{border-color:#fff;opacity:1;}

  .preco-de-riscado{font-size:10px;color:var(--text-muted);text-decoration:line-through;}
  .preco-promo{color:#B8873B;font-weight:500;}
  .badge-desc{background:#FAECE7;border:0.5px solid #D85A30;border-radius:20px;padding:1px 5px;font-size:9px;font-weight:500;color:#712B13;margin-left:3px;vertical-align:middle;}

/* === BOTTOM SHEET DE DETALHE DO ITEM === */
.bs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:998;}
.bs-overlay.open{display:flex;}
.bs-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;position:relative;display:flex;flex-direction:column;}
.bs-handle{width:36px;height:4px;background:#E3D8C4;border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.bs-close{position:absolute;top:10px;right:14px;width:30px;height:30px;border-radius:50%;border:none;background:#F0EBE3;cursor:pointer;font-size:15px;color:#6B5B47;display:flex;align-items:center;justify-content:center;z-index:2;}
.bs-scroll{flex:1;overflow-y:auto;scrollbar-width:none;}
.bs-scroll::-webkit-scrollbar{display:none;}
/* Carrossel */
.bs-carousel{width:100%;aspect-ratio:4/3;background:#FBF3E2;overflow:hidden;position:relative;}
.bs-car-track{display:flex;height:100%;transition:transform .25s ease;}
.bs-car-track img{width:100%;height:100%;object-fit:cover;flex-shrink:0;}
.bs-car-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#8A7860;font-size:13px;gap:8px;flex-direction:column;}
.bs-car-empty i{font-size:32px;}
.bs-car-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;}
.bs-car-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .2s;}
.bs-car-dots span.on{background:#fff;width:16px;border-radius:3px;}
.bs-car-btn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.bs-car-btn.prev{left:8px;} .bs-car-btn.next{right:8px;}
/* Miniaturas */
.bs-thumbs{display:flex;gap:7px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;}
.bs-thumbs::-webkit-scrollbar{display:none;}
.bs-thumb{width:50px;height:50px;border-radius:8px;border:2px solid transparent;overflow:hidden;cursor:pointer;flex-shrink:0;background:#F5F0E8;}
.bs-thumb img{width:100%;height:100%;object-fit:cover;}
.bs-thumb.on{border-color:#B8873B;}
/* Info */
.bs-info{padding:14px 16px 0;}
.bs-badge{display:inline-block;background:#FBF3E2;color:#6B4E1E;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:8px;}
.bs-nome{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:#3B2314;line-height:1.2;margin-bottom:10px;}
.bs-preco-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8A7860;margin-bottom:3px;}
.bs-preco-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
.bs-preco-atual{font-size:26px;font-weight:700;color:#B8873B;font-variant-numeric:tabular-nums;line-height:1;}
.bs-preco-de{font-size:13px;color:#8A7860;text-decoration:line-through;font-variant-numeric:tabular-nums;}
.bs-preco-badge{background:#E8F5E9;color:#2E7D32;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.bs-divider{height:1px;background:#E3D8C4;margin:14px 0;}
.bs-desc-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8A7860;margin-bottom:6px;}
.bs-desc{font-size:13.5px;color:#6B5B47;line-height:1.65;}
.bs-scroll-pad{height:90px;}
/* Footer */
.bs-footer{flex-shrink:0;background:#fff;border-top:1px solid #E3D8C4;padding:11px 16px;padding-bottom:max(11px,env(safe-area-inset-bottom,11px));}
.bs-footer-row{display:flex;align-items:center;gap:10px;}
.bs-stepper{display:flex;align-items:center;border:1.5px solid #E3D8C4;border-radius:10px;overflow:hidden;flex-shrink:0;}
.bs-stepper button{width:38px;height:42px;background:none;border:none;font-size:18px;cursor:pointer;color:#3B2314;display:flex;align-items:center;justify-content:center;}
.bs-stepper-num{width:32px;text-align:center;font-size:15px;font-weight:600;color:#3B2314;font-variant-numeric:tabular-nums;}
.bs-btn-add{flex:1;height:42px;background:#B8873B;color:#fff;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;}
.bs-btn-add:active{opacity:.82;}
.bs-total{font-size:12px;opacity:.85;font-weight:500;}
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <i class="ti ti-arrow-left" onclick="voltarParaEscolha()"></i>
    <h2>Escolha seus produtos</h2>
  </div>
  <div class="subtotal-label">Total do pedido: <b id="total-pedido">R$ 0,00</b></div>

  <div class="busca-box">
    <i class="ti ti-search"></i>
    <input type="text" id="busca-input" placeholder="Buscar produto..." oninput="filtrarItens()">
    <i class="ti ti-x limpar" id="busca-limpar" onclick="limparBusca()"></i>
  </div>

  <div id="categorias-container" style="overflow-y:auto;flex:1;"></div>
  <div class="sem-resultado" id="sem-resultado" style="display:none;">Nenhum produto encontrado.</div>

  <div class="carrinho-bar">
    <div>
      <div class="qtd-total" id="carrinho-qtd">0 itens</div>
      <div class="valor-total" id="carrinho-valor">R$ 0,00</div>
    </div>
    <button class="btn-primary" id="btn-ver-carrinho" onclick="verCarrinho()" disabled>Ver carrinho</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="catalogo.js"></script>
<script>
let CATALOGO, ITENS = {}, CATEGORIAS = {};

/* ---------- Info do bairro/retirada vinda do mod1 ---------- */
let INFO_ENTREGA = { bairro: '', frete: 0, minimo: 0, retirada: false };
try {
  const raw = localStorage.getItem('domleon_avulso_bairro');
  if (raw) INFO_ENTREGA = JSON.parse(raw);
} catch (e) { console.error(e); }

/* ---------- Carrinho (persistido em localStorage entre mod9 e mod10) ---------- */
let CARRINHO = {}; // itemId -> qtd
try {
  const raw = localStorage.getItem('domleon_carrinho_avulso');
  if (raw) CARRINHO = JSON.parse(raw);
} catch (e) { console.error(e); }

function salvarCarrinho(){
  localStorage.setItem('domleon_carrinho_avulso', JSON.stringify(CARRINHO));
}

/* ---------- Render das categorias/itens ---------- */
function renderizarCategorias(filtroTexto){
  const container = document.getElementById('categorias-container');
  container.innerHTML = '';
  const filtro = filtroTexto ? removerAcentos(filtroTexto.trim()) : '';
  let algumResultado = false;

  Object.keys(CATEGORIAS).forEach((catNome, idx) => {
    const idsCategoria = CATEGORIAS[catNome].filter(id => {
      if (!filtro) return true;
      return removerAcentos(ITENS[id].nome).includes(filtro);
    });
    if (idsCategoria.length === 0) return; // categoria sem resultado some inteira
    algumResultado = true;

    const bloco = document.createElement('div');
    bloco.className = 'categoria' + (filtro ? ' aberta' : '');

    const titulo = document.createElement('div');
    titulo.className = 'categoria-titulo';
    titulo.onclick = () => alternarCategoria(bloco);
    titulo.innerHTML = `<span>${catNome}</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
    bloco.appendChild(titulo);

    const itensWrap = document.createElement('div');
    itensWrap.className = 'categoria-itens';

    idsCategoria.forEach(itemId => {
      const item = ITENS[itemId];
      const qtd = CARRINHO[itemId] || 0;
      const thumb = item.imagem
        ? `<img src="${item.imagem}" alt="${item.nome}">`
        : `<i class="ti ti-photo" style="font-size:18px;"></i>`;
      const nomeHtml = filtro ? destacarTexto(item.nome, filtroTexto) : item.nome;
      const projetoId = localStorage.getItem('domleon_projeto_id') || 'avulso';
      const precoAvulso = precoPorProjeto(item, projetoId, CATALOGO) || item.precoAvulso || item.preco || 0;
      const infoKg = item.precoKg ? ` · R$ ${item.precoKg.toFixed(2).replace('.', ',')}/kg` : '';
      const precoPromo = (typeof precoPromoAtiva === 'function') ? precoPromoAtiva(item, 'avulso') : null;

      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-thumb" onclick="abrirLightbox('${itemId}')" style="cursor:pointer;">${thumb}</div>
        <div class="item-info">
          <div class="nome" onclick="abrirPopupItem('${itemId}')" style="cursor:pointer;">${nomeHtml}</div>
          <div class="preco-un">
            ${precoPromo !== null
              ? `<span class="preco-de-riscado">R$ ${precoAvulso.toFixed(2).replace('.', ',')}</span>
                 <span class="preco-promo"> R$ ${precoPromo.toFixed(2).replace('.', ',')}${infoKg}</span>
                 <span class="badge-desc">-${Math.round((1-precoPromo/precoAvulso)*100)}%</span>`
              : `R$ ${precoAvulso.toFixed(2).replace('.', ',')}${infoKg}`
            }
          </div>
        </div>
        <div class="stepper">
          <button onclick="alterarItem('${itemId}', -1)">−</button>
          <span class="qtd" id="qtd-${itemId}">${qtd}</span>
          <button onclick="alterarItem('${itemId}', 1)">+</button>
        </div>`;
      itensWrap.appendChild(row);
    });
    bloco.appendChild(itensWrap);
    container.appendChild(bloco);
  });

  document.getElementById('sem-resultado').style.display = algumResultado ? 'none' : 'block';
}

// Mantém só uma categoria aberta por vez — abrir uma fecha a anterior
function alternarCategoria(blocoClicado){
  const jaAberta = blocoClicado.classList.contains('aberta');
  document.querySelectorAll('#categorias-container .categoria').forEach(b => b.classList.remove('aberta'));
  if (!jaAberta) blocoClicado.classList.add('aberta');
}

function destacarTexto(texto, filtro){
  const idx = removerAcentos(texto).indexOf(removerAcentos(filtro));
  if (idx === -1) return texto;
  return texto.slice(0, idx) + '<mark>' + texto.slice(idx, idx + filtro.length) + '</mark>' + texto.slice(idx + filtro.length);
}

function filtrarItens(){
  const valor = document.getElementById('busca-input').value;
  document.getElementById('busca-limpar').style.display = valor ? 'block' : 'none';
  renderizarCategorias(valor);
}

function limparBusca(){
  document.getElementById('busca-input').value = '';
  document.getElementById('busca-limpar').style.display = 'none';
  renderizarCategorias('');
}

/* ---------- Carrinho: alterar quantidade ---------- */
function alterarItem(itemId, delta){
  const atual = CARRINHO[itemId] || 0;
  const novo = Math.max(0, atual + delta);
  if (novo === 0) delete CARRINHO[itemId];
  else CARRINHO[itemId] = novo;
  document.getElementById('qtd-' + itemId).textContent = novo;
  salvarCarrinho();
  atualizarResumo();
}

function calcularSubtotal(){
  let total = 0;
  for (const itemId in CARRINHO){
    const item = ITENS[itemId];
    if (item) total += CARRINHO[itemId] * (precoPorProjeto(item, localStorage.getItem('domleon_projeto_id') || 'avulso', CATALOGO) || item.precoAvulso || item.preco || 0);
  }
  return total;
}

function contarItens(){
  return Object.values(CARRINHO).reduce((a, b) => a + b, 0);
}

function atualizarResumo(){
  const subtotal = calcularSubtotal();
  const qtd = contarItens();
  document.getElementById('total-pedido').textContent = 'R$ ' + subtotal.toFixed(2).replace('.', ',');
  document.getElementById('carrinho-qtd').textContent = qtd + (qtd === 1 ? ' item' : ' itens');
  document.getElementById('carrinho-valor').textContent = 'R$ ' + subtotal.toFixed(2).replace('.', ',');
  document.getElementById('btn-ver-carrinho').disabled = qtd === 0;
}

/* ---------- Navegação ---------- */
function voltarParaEscolha(){
  window.location.href = 'mod1-cad-catalogo.html';
}

function verCarrinho(){
  if (contarItens() === 0) return;
  window.location.href = 'mod10-checkout-avulso.html';
}

/* ---------- Inicialização ---------- */
(async function init(){
  CATALOGO = await carregarCatalogo();
  const projetoId = localStorage.getItem('domleon_projeto_id') || 'avulso';
  categoriasPorProjeto(CATALOGO, projetoId).forEach(cat => { CATEGORIAS[cat] = []; });
  itensPorProjeto(CATALOGO, projetoId).forEach(item => {
    ITENS[item.id] = item;
    if (!CATEGORIAS[item.categoria]) CATEGORIAS[item.categoria] = [];
    CATEGORIAS[item.categoria].push(item.id);
  });
  Object.keys(CATEGORIAS).forEach(cat => { if (CATEGORIAS[cat].length === 0) delete CATEGORIAS[cat]; });

  renderizarCategorias('');
  atualizarResumo();
})();

/* ---------- Lightbox de imagens (clique na thumb) ---------- */
let _lbImgs = [];
let _lbIdx  = 0;

function abrirLightbox(itemId){
  event.stopPropagation();
  const item = ITENS[itemId];
  _lbImgs = (item && item.imagens && item.imagens.length) ? item.imagens
           : (item && item.imagem) ? [item.imagem] : [];
  _lbIdx = 0;
  _renderLightbox();
  document.getElementById('lightbox').classList.add('open');
}

function _renderLightbox(){
  const wrap  = document.getElementById('lb-car-imgs');
  const dots  = document.getElementById('lb-dots');
  const thumbs = document.getElementById('lb-thumbs');
  const prev  = document.getElementById('lb-prev');
  const next  = document.getElementById('lb-next');

  if(_lbImgs.length === 0){
    document.getElementById('lb-car-wrap').innerHTML = '<div class="lb-sem-img"><i class="ti ti-photo-off" aria-hidden="true"></i><span>Sem fotos cadastradas</span></div>';
    dots.innerHTML = ''; thumbs.innerHTML = '';
    return;
  }

  wrap.innerHTML = _lbImgs.map(src => '<img src="'+src+'" alt="foto">').join('');
  wrap.style.transform = 'translateX(-' + _lbIdx*100 + '%)';

  const multi = _lbImgs.length > 1;
  if(prev) prev.style.display = multi ? 'flex' : 'none';
  if(next) next.style.display = multi ? 'flex' : 'none';

  dots.innerHTML = multi ? _lbImgs.map((_,i) => '<span class="'+(i===_lbIdx?'on':'')+'" onclick="lbIr('+i+')"></span>').join('') : '';
  thumbs.innerHTML = multi ? _lbImgs.map((src,i) => '<img src="'+src+'" class="'+(i===_lbIdx?'on':'')+'" onclick="lbIr('+i+')" alt="miniatura">').join('') : '';
}

function lbMover(d){ _lbIdx = (_lbIdx+d+_lbImgs.length)%_lbImgs.length; _atualizarLb(); }
function lbIr(i){ _lbIdx = i; _atualizarLb(); }
function _atualizarLb(){
  document.getElementById('lb-car-imgs').style.transform = 'translateX(-'+_lbIdx*100+'%)';
  document.querySelectorAll('.lb-dots span').forEach((s,i)=>s.classList.toggle('on',i===_lbIdx));
  document.querySelectorAll('.lb-thumbs img').forEach((s,i)=>s.classList.toggle('on',i===_lbIdx));
}
function fecharLightbox(e){ if(!e || e.target===document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('open'); }

/* ===== BOTTOM SHEET DE DETALHE ===== */
let _bsItemId = null;
let _bsQty = 1;
let _bsImgs = [];
let _bsIdx = 0;

function abrirBottomSheet(itemId, imgIdx){
  _bsItemId = itemId;
  _bsQty = CARRINHO[itemId] || 1;
  const item = ITENS[itemId];
  if(!item) return;

  // Imagens
  _bsImgs = (item.imagens && item.imagens.length) ? item.imagens : (item.imagem ? [item.imagem] : []);
  _bsIdx = (imgIdx !== undefined && imgIdx < _bsImgs.length) ? imgIdx : 0;
  _bsRenderCarrossel();

  // Badge
  const badgeEl = document.getElementById('bs-badge');
  if(item.categoria){ badgeEl.textContent = item.categoria; badgeEl.hidden = false; }
  else badgeEl.hidden = true;

  // Nome
  document.getElementById('bs-nome').textContent = item.nome;

  // Preço (contexto avulso)
  const projetoId = localStorage.getItem('domleon_projeto_id') || 'avulso';
  const precoBase = (typeof precoPorProjeto === 'function')
    ? precoPorProjeto(item, projetoId, CATALOGO)
    : (item.precoAvulso || item.preco || 0);
  const precoPromo = (typeof precoPromoAtiva === 'function') ? precoPromoAtiva(item, projetoId) : null;
  const precoFinal = precoPromo !== null ? precoPromo : precoBase;

  document.getElementById('bs-preco-label').textContent = 'Preço avulso';
  document.getElementById('bs-preco-atual').textContent = 'R$ ' + precoFinal.toFixed(2).replace('.',',');
  const deEl = document.getElementById('bs-preco-de');
  const badgePct = document.getElementById('bs-preco-badge');
  if(precoPromo !== null && precoBase > 0){
    deEl.textContent = 'R$ ' + precoBase.toFixed(2).replace('.',','); deEl.hidden = false;
    badgePct.textContent = '-' + Math.round((1-precoPromo/precoBase)*100) + '%'; badgePct.hidden = false;
  } else { deEl.hidden = true; badgePct.hidden = true; }

  // Kg info
  const kgEl = document.getElementById('bs-kg');
  if(item.precoKg){ kgEl.textContent = 'Peso médio: '+item.pesoGramas+'g · R$ '+item.precoKg.toFixed(2).replace('.',',')+'/kg'; kgEl.hidden = false; }
  else kgEl.hidden = true;

  // Descrição
  const descEl = document.getElementById('bs-desc-wrap');
  document.getElementById('bs-desc').textContent = item.descricao || '';
  descEl.hidden = !item.descricao;

  // Qty e total
  _bsAtualizarQty(precoFinal);

  document.getElementById('bs-overlay').classList.add('open');
}

// Alias para o clique no nome (mantém compatibilidade)
function abrirPopupItem(itemId){ event.stopPropagation(); abrirBottomSheet(itemId); }

function fecharBottomSheet(e){
  if(!e || e.target === document.getElementById('bs-overlay'))
    document.getElementById('bs-overlay').classList.remove('open');
}

function _bsRenderCarrossel(){
  const track = document.getElementById('bs-car-track');
  const dots  = document.getElementById('bs-car-dots');
  const thumbs = document.getElementById('bs-thumbs');
  const prev  = document.getElementById('bs-car-prev');
  const next  = document.getElementById('bs-car-next');
  const empty = document.getElementById('bs-car-empty');

  if(_bsImgs.length === 0){
    track.innerHTML = ''; dots.innerHTML = ''; thumbs.innerHTML = '';
    if(prev) prev.hidden = true; if(next) next.hidden = true;
    empty.hidden = false; return;
  }
  empty.hidden = true;
  track.innerHTML = _bsImgs.map(src => '<img src="'+src+'" alt="">').join('');
  track.style.transform = 'translateX(-' + _bsIdx*100 + '%)';

  const multi = _bsImgs.length > 1;
  if(prev) prev.hidden = !multi; if(next) next.hidden = !multi;
  dots.innerHTML = multi ? _bsImgs.map((_,i)=>'<span class="'+(i===_bsIdx?'on':'')+'"></span>').join('') : '';
  thumbs.innerHTML = multi ? _bsImgs.map((src,i)=>'<div class="bs-thumb'+(i===_bsIdx?' on':'')+'" onclick="_bsIr('+i+')"><img src="'+src+'" alt=""></div>').join('') : '';
}

function _bsMover(d){ if(!_bsImgs.length) return; _bsIdx = (_bsIdx+d+_bsImgs.length)%_bsImgs.length; _bsAtualizar(); }
function _bsIr(i){ _bsIdx = i; _bsAtualizar(); }
function _bsAtualizar(){
  document.getElementById('bs-car-track').style.transform = 'translateX(-'+_bsIdx*100+'%)';
  document.querySelectorAll('#bs-car-dots span').forEach((s,i)=>s.classList.toggle('on',i===_bsIdx));
  document.querySelectorAll('.bs-thumb').forEach((t,i)=>t.classList.toggle('on',i===_bsIdx));
}

function _bsAtualizarQty(precoOverride){
  document.getElementById('bs-qty-num').textContent = _bsQty;
  const item = ITENS[_bsItemId];
  if(!item) return;
  const projetoId = localStorage.getItem('domleon_projeto_id') || 'avulso';
  const precoBase = precoOverride !== undefined ? precoOverride
    : ((typeof precoPorProjeto === 'function') ? precoPorProjeto(item, projetoId, CATALOGO) : (item.precoAvulso || item.preco || 0));
  const precoPromo = (typeof precoPromoAtiva === 'function') ? precoPromoAtiva(item, projetoId) : null;
  const precoFinal = precoPromo !== null ? precoPromo : precoBase;
  document.getElementById('bs-total').textContent = '· R$ ' + (precoFinal * _bsQty).toFixed(2).replace('.',',');
}

function _bsChangeQty(d){
  _bsQty = Math.max(1, _bsQty + d);
  _bsAtualizarQty();
}

function _bsAdicionar(){
  if(!_bsItemId) return;
  const delta = _bsQty - (CARRINHO[_bsItemId] || 0);
  if(delta !== 0){ alterarItem(_bsItemId, delta); }
  const btn = document.getElementById('bs-btn-add');
  const span = btn.querySelector('.bs-add-label');
  span.textContent = '✓ Adicionado!'; btn.style.opacity = '.75';
  setTimeout(()=>{ span.textContent = 'Adicionar'; btn.style.opacity = ''; }, 1300);
  document.getElementById('bs-overlay').classList.remove('open');
}
</script>

<script src="capacitor-back.js"></script>

<!-- Lightbox de imagens -->
<div class="lightbox" id="lightbox" onclick="fecharLightbox(event)">
  <button class="lightbox-close-btn" onclick="fecharLightbox()"><i class="ti ti-x" aria-hidden="true"></i></button>
  <div class="lb-car-wrap" id="lb-car-wrap">
    <div class="lb-car-imgs" id="lb-car-imgs"></div>
    <button class="lb-btn prev" id="lb-prev" onclick="lbMover(-1)" style="display:none;"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
    <button class="lb-btn next" id="lb-next" onclick="lbMover(1)" style="display:none;"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
  </div>
  <div class="lb-dots" id="lb-dots"></div>
  <div class="lb-thumbs" id="lb-thumbs"></div>
</div>

<!-- Bottom Sheet detalhe do produto -->
<div class="bs-overlay" id="bs-overlay" onclick="fecharBottomSheet(event)">
  <div class="bs-sheet">
    <div class="bs-handle"></div>
    <button class="bs-close" onclick="fecharBottomSheet()">✕</button>
    <div class="bs-scroll">
      <!-- Carrossel -->
      <div class="bs-carousel">
        <div class="bs-car-track" id="bs-car-track"></div>
        <div class="bs-car-empty" id="bs-car-empty" hidden><i class="ti ti-photo-off"></i><span>Sem fotos</span></div>
        <button class="bs-car-btn prev" id="bs-car-prev" onclick="_bsMover(-1)" hidden><i class="ti ti-chevron-left"></i></button>
        <button class="bs-car-btn next" id="bs-car-next" onclick="_bsMover(1)" hidden><i class="ti ti-chevron-right"></i></button>
        <div class="bs-car-dots" id="bs-car-dots"></div>
      </div>
      <!-- Miniaturas -->
      <div class="bs-thumbs" id="bs-thumbs"></div>
      <!-- Info -->
      <div class="bs-info">
        <div class="bs-badge" id="bs-badge"></div>
        <div class="bs-nome" id="bs-nome"></div>
        <div class="bs-preco-label" id="bs-preco-label">Preço avulso</div>
        <div class="bs-preco-row">
          <span class="bs-preco-atual" id="bs-preco-atual">R$ 0,00</span>
          <span class="bs-preco-de" id="bs-preco-de" hidden></span>
          <span class="bs-preco-badge" id="bs-preco-badge" hidden></span>
        </div>
        <div id="bs-kg" style="font-size:11px;color:#8A7860;margin-bottom:4px;" hidden></div>
        <div class="bs-divider"></div>
        <div id="bs-desc-wrap" hidden>
          <div class="bs-desc-label">Descrição</div>
          <div class="bs-desc" id="bs-desc"></div>
          <div class="bs-divider"></div>
        </div>
        <div class="bs-scroll-pad"></div>
      </div>
    </div>
    <!-- Footer fixo -->
    <div class="bs-footer">
      <div class="bs-footer-row">
        <div class="bs-stepper">
          <button onclick="_bsChangeQty(-1)">−</button>
          <span class="bs-stepper-num" id="bs-qty-num">1</span>
          <button onclick="_bsChangeQty(1)">+</button>
        </div>
        <button class="bs-btn-add" id="bs-btn-add" onclick="_bsAdicionar()">
          <span class="bs-add-label">Adicionar</span>
          <span class="bs-total" id="bs-total">· R$ 0,00</span>
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
